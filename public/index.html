<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stayo - Architectural Concierge</title>
    <style>
        /* Design System Tokens */
        :root {
            --color-primary: #0A3B2C;
            --color-secondary: #D4AF37;
            --color-bg: #FAFAFA;
            --color-surface: #FFFFFF;
            --color-border: #E0E0E0;
            --color-text: #121212;
            --color-text-muted: #6B6B6B;

            --font-family: "Avenir Next", Avenir, sans-serif;
            
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 32px;
            --space-xl: 64px;
            --space-xxl: 128px;
        }

        /* Base Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */
        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-md);
        }

        h2 {
            font-size: clamp(1.5rem, 3vw, 2.25rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
            margin-bottom: var(--space-md);
        }

        p {
            font-size: 1rem;
            max-width: 75ch;
            margin-bottom: var(--space-md);
        }

        label, .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-muted);
            margin-bottom: var(--space-sm);
        }

        /* Layout & Structure */
        header {
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-md) var(--space-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-surface);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--color-primary);
        }

        main {
            padding: var(--space-xl) var(--space-lg);
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
            margin-bottom: var(--space-xxl);
        }

        .hero-image {
            width: 100%;
            height: 600px;
            object-fit: cover;
            border-radius: 0; /* Architectural rule */
        }

        .search-panel {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: var(--space-lg);
            align-self: center;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: var(--space-lg);
        }

        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: var(--space-md);
            border: 1px solid var(--color-border);
            border-radius: 2px; /* sm radius */
            font-family: inherit;
            font-size: 1rem;
            background-color: var(--color-surface);
            color: var(--color-text);
            transition: border-color 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        /* Buttons */
        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-surface);
            border: none;
            border-radius: 2px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #06261c;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--color-primary);
            border: 1px solid var(--color-primary);
            border-radius: 2px;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }

        /* Result Cards */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-lg);
            margin-top: var(--space-lg);
        }

        .card {
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            padding: var(--space-md);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: var(--space-md);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .price {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .hero-image {
                height: 300px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Stayo</div>
        <nav>
            <button class="btn-secondary">Admin Login</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="search-panel">
                <h1>Find your next sanctuary.</h1>
                <p>Experience spaces designed with architectural precision and uncompromising hospitality.</p>
                
                <form id="searchForm" onsubmit="event.preventDefault();">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" placeholder="Where are you going?">
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label>Check-in</label>
                            <input type="date">
                        </div>
                        <div class="form-group">
                            <label>Check-out</label>
                            <input type="date">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Guests</label>
                        <input type="number" min="1" value="2">
                    </div>
                    <button type="submit" class="btn-primary" onclick="searchRooms()">Check Availability</button>
                </form>
            </div>
            <img src="https://images.unsplash.com/photo-1582719508461-905c673771fd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Minimalist hotel interior" class="hero-image">
        </section>

        <section id="resultsSection" style="display: none;">
            <h2>Available Rooms</h2>
            <div class="results-grid" id="resultsGrid">
                <!-- Results will be injected here -->
            </div>
        </section>
    </main>

    <script>
        function searchRooms() {
            document.getElementById('resultsSection').style.display = 'block';
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = `
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Room">
                    <div class="card-header">
                        <h3>Superior Double</h3>
                        <div class="price">$250 / night</div>
                    </div>
                    <p class="label" style="margin-top: 8px;">Capacity: 2 Guests</p>
                    <button class="btn-primary" style="margin-top: 16px; padding: 8px 16px;">Reserve</button>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1578683010236-d716f9a3f461?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" alt="Room">
                    <div class="card-header">
                        <h3>Architect Suite</h3>
                        <div class="price">$450 / night</div>
                    </div>
                    <p class="label" style="margin-top: 8px;">Capacity: 4 Guests</p>
                    <button class="btn-primary" style="margin-top: 16px; padding: 8px 16px;">Reserve</button>
                </div>
            `;
            // Scroll to results
            document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
